---
name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (server)
    runs-on: ubuntu-latest
    if: hashFiles('server/go.mod') != ''
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  android:
    name: Android
    runs-on: ubuntu-latest
    if: hashFiles('android/settings.gradle*') != ''
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: ./gradlew assembleDebug
      - name: Unit tests
        run: ./gradlew testDebugUnitTest

  rust:
    name: Rust (desktop)
    runs-on: ubuntu-latest
    if: hashFiles('desktop/Cargo.toml') != ''
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -D warnings
      - name: Test
        run: cargo test

  web:
    name: Web
    runs-on: ubuntu-latest
    if: hashFiles('web/package.json') != ''
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            docs/**/*.md
            README.md
