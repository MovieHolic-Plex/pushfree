# Release pipeline for the pushfree server (todo 47).
#
# Tag-driven: pushing a `v*` tag builds the cross-platform binaries via
# GoReleaser and publishes a GitHub Release with auto-generated changelog
# and checksums. Also runnable manually via workflow_dispatch for a dry-run.
#
# GoReleaser CLI version is pinned (v2.5.1) to match the locally validated
# .goreleaser.yaml schema.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run goreleaser in snapshot/dry-run mode (no publish)'
        required: false
        default: 'true'

permissions:
  contents: write  # goreleaser-action creates/updates the GitHub Release

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Full history is required for the changelog and CommitTimestamp builds.
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Resolve goreleaser args
        id: args
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "args=release --snapshot --clean" >> "$GITHUB_OUTPUT"
          else
            echo "args=release --clean" >> "$GITHUB_OUTPUT"
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          # Pinned to the exact validated version.
          version: v2.5.1
          args: ${{ steps.args.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
