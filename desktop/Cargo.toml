[package]
name = "pushfree-desktop"
version = "0.1.0"
description = "PushFree desktop client (Tauri 2)"
authors = ["PushFree"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "net", "macros"] }
tokio-tungstenite = "0.27"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = [
    "charset",
    "http2",
    "default-tls",
] }
async-trait = "0.1"
aes = "0.8"
base64 = "0.21"
flate2 = "1"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "net", "macros", "test-util"] }
