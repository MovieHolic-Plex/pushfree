# Gradle / Kotlin JVM config
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# ---- App versioning (SINGLE SOURCE OF TRUTH) ----
# versionCode/versionName are declared here ONCE and consumed by:
#   - android/app/build.gradle.kts (defaultConfig)
#   - android/metadata/net.pushfree.android.yml (F-Droid, mirror)
#   - android/RELEASING.md (release docs)
# Bump them here and update the F-Droid yml mirror in the same commit.
pushfree.versionCode=1
pushfree.versionName=0.1.0
